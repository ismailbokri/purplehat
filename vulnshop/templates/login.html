{% extends "base.html" %}
{% block content %}
<div class="panel auth">
  <h1>Sign in</h1>
  <p class="muted">Welcome back. Enter your details to continue.</p>
  {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('login') }}">
    <div class="field">
      <label>Username</label>
      <input name="username" autocomplete="off" placeholder="your username">
    </div>
    <div class="field">
      <label>Password</label>
      <input name="password" type="password" placeholder="••••••••">
    </div>
    <button class="btn block" type="submit">Sign in</button>
  </form>
  <p class="hint">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
  <p class="hint">Demo accounts: <code>alice / password123</code></p>
</div>
{% endblock %}
