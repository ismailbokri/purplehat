version: '3'

services:
  pgvector:
    image: ankane/pgvector
    container_name: pgvector-db
    ports:
      - "6000:5432"
    environment:
      POSTGRES_PASSWORD: 0000
      POSTGRES_DB: pfe
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pentest-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri /mlflow
      --host 0.0.0.0
      --port 5000
    networks:
      - pentest-net

volumes:
  pgdata:
  mlflow_data:

networks:
  pentest-net:
    external: true